name: build-tp-agent

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "st52/talon-pilot ref (dry build only)"
        default: main

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            asset: linux-x64
            shim: true
          - runner: macos-14
            rust_target: aarch64-apple-darwin
            asset: macos-arm64
            shim: false
          - runner: macos-14
            rust_target: x86_64-apple-darwin
            asset: macos-x64
            shim: false
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout st52 sources
        env:
          XGIT_TOKEN: ${{ secrets.XGIT_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            SOURCE_REF=$(tr -d '\r\n' < .talon-pilot-source)
            [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::.talon-pilot-source must contain one 40-char SHA"; exit 1;
            }
          else
            SOURCE_REF="${SOURCE_REF:-main}"
          fi
          auth="https://oauth2:${XGIT_TOKEN}@x.xgit.pro/st52"
          git clone --filter=blob:none "$auth/talon-pilot.git" build/talon-pilot
          git -C build/talon-pilot checkout --detach "$SOURCE_REF"
          git clone --depth 1 https://github.com/stcn52/talon-bin.git build/talon-bin
          git clone --depth 1 https://github.com/stcn52/talon-sandbox-sdk-rust.git build/talon-sandbox-sdk-rust
          rm -rf build/talon-bin/talon-bundle build/talon-bin/talon-bundle-evocore

      - name: Verify release source and version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          XGIT_TOKEN: ${{ secrets.XGIT_TOKEN }}
        run: |
          set -euo pipefail
          expected_version="${GITHUB_REF_NAME#v}"
          actual_version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' \
            build/talon-pilot/Cargo.toml | head -n 1)
          test "$actual_version" = "$expected_version" || {
            echo "::error::tag $GITHUB_REF_NAME != talon-pilot workspace $actual_version"; exit 1;
          }
          source_head=$(git -C build/talon-pilot rev-parse HEAD)
          tag_source=$(tr -d '\r\n' < .talon-pilot-source)
          test "$source_head" = "$tag_source" || {
            echo "::error::build source does not match annotated tag SHA"; exit 1;
          }
          ! grep -En 'darkmice/talon-pilot-client|api\.github\.com/repos/darkmice' \
            build/talon-pilot/crates/pilot-edge/src/updater.rs

      - name: Rewrite sibling talon-sys path
        run: |
          perl -i -pe 's{path\s*=\s*"/Users/[^"]*/talon-bin/talon-sys"}{path = "../../../talon-bin/talon-sys"}' \
            build/talon-pilot/crates/pilot-storage/Cargo.toml
          grep talon-sys build/talon-pilot/crates/pilot-storage/Cargo.toml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: build/talon-pilot

      - name: Build Linux binaries
        if: matrix.shim
        run: |
          set -euo pipefail
          cc -c -fPIC -O2 scripts/glibc23-shim.c -o /tmp/glibc23-shim.o
          cd build/talon-pilot
          for bin in tp-agent tp; do
            cargo rustc -p pilot-agent --release --target ${{ matrix.rust_target }} --bin "$bin" -- \
              -Clink-arg=/tmp/glibc23-shim.o -Clink-arg=-Wl,--allow-multiple-definition
          done

      - name: Build macOS binaries
        if: ${{ !matrix.shim }}
        run: |
          set -euo pipefail
          cd build/talon-pilot
          cargo build -p pilot-agent --release --target ${{ matrix.rust_target }} --bin tp-agent --bin tp

      - name: Verify and package
        run: |
          set -euo pipefail
          out="build/talon-pilot/target/${{ matrix.rust_target }}/release"
          mkdir -p dist
          test -s "$out/tp-agent" && test -s "$out/tp"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            "$out/tp-agent" --version | grep -F "${GITHUB_REF_NAME#v}"
            "$out/tp" --version | grep -F "${GITHUB_REF_NAME#v}"
          fi
          tar -czf "dist/tp-agent-${{ matrix.asset }}.tar.gz" -C "$out" tp-agent tp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tp-agent-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: build (windows-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve source ref
        id: source
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $sourceRef = (Get-Content .talon-pilot-source -Raw).Trim()
            if ($sourceRef -notmatch '^[0-9a-f]{40}$') {
              throw ".talon-pilot-source must contain one 40-char SHA"
            }
          } else {
            $sourceRef = if ([string]::IsNullOrWhiteSpace($env:SOURCE_REF)) { "main" } else { $env:SOURCE_REF }
          }
          "ref=$sourceRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout st52 sources
        shell: pwsh
        env:
          XGIT_TOKEN: ${{ secrets.XGIT_TOKEN }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          $ErrorActionPreference = "Stop"
          $auth = "https://oauth2:$env:XGIT_TOKEN@x.xgit.pro/st52"
          git clone --filter=blob:none "$auth/talon-pilot.git" build/talon-pilot
          git -C build/talon-pilot checkout --detach $env:SOURCE_REF
          git clone --depth 1 https://github.com/stcn52/talon-bin.git build/talon-bin
          git clone --depth 1 https://github.com/stcn52/talon-sandbox-sdk-rust.git build/talon-sandbox-sdk-rust
          Remove-Item -Recurse -Force build/talon-bin/talon-bundle, build/talon-bin/talon-bundle-evocore -ErrorAction SilentlyContinue

      - name: Verify release source and version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          $ErrorActionPreference = "Stop"
          $cargoToml = Get-Content build/talon-pilot/Cargo.toml -Raw
          $match = [regex]::Match($cargoToml, '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "cannot read workspace version" }
          $expected = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($match.Groups[1].Value -ne $expected) {
            throw "tag $env:GITHUB_REF_NAME does not match workspace version $($match.Groups[1].Value)"
          }
          $head = (git -C build/talon-pilot rev-parse HEAD).Trim()
          if ($head -ne $env:SOURCE_REF) { throw "build source does not match annotated tag SHA" }
          $legacy = Select-String -Path build/talon-pilot/crates/pilot-edge/src/updater.rs `
            -Pattern 'darkmice/talon-pilot-client|api\.github\.com/repos/darkmice'
          if ($legacy) { throw "updater still contains legacy release source" }

      - name: Rewrite sibling talon-sys path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "build/talon-pilot/crates/pilot-storage/Cargo.toml"
          $content = Get-Content $path -Raw
          $content = $content -replace 'path\s*=\s*"/Users/[^"]*/talon-bin/talon-sys"', 'path = "../../../talon-bin/talon-sys"'
          Set-Content -Path $path -Value $content -Encoding utf8
          Select-String -Path $path -Pattern 'talon-sys'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: build/talon-pilot

      - name: Build Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location build/talon-pilot
          foreach ($bin in @("tp-agent", "tp")) {
            cargo rustc -p pilot-agent --release --target x86_64-pc-windows-msvc --bin $bin -- -Clink-arg=/FORCE:MULTIPLE
            if ($LASTEXITCODE -ne 0) { throw "cargo failed for $bin" }
          }
          Pop-Location

      - name: Verify and package Windows artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "build/talon-pilot/target/x86_64-pc-windows-msvc/release"
          foreach ($bin in @("tp-agent.exe", "tp.exe")) {
            if (-not (Test-Path "$out/$bin" -PathType Leaf)) { throw "missing $bin" }
          }
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $expected = $env:GITHUB_REF_NAME -replace '^v', ''
            if ((& "$out/tp-agent.exe" --version).Trim() -ne $expected) { throw "tp-agent version mismatch" }
            if ((& "$out/tp.exe" --version).Trim() -ne "tp $expected") { throw "tp version mismatch" }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$out/tp-agent.exe", "$out/tp.exe" -DestinationPath dist/tp-agent-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tp-agent-windows-x64
          path: dist/tp-agent-windows-x64.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify complete asset set
        run: |
          set -euo pipefail
          for asset in \
            tp-agent-linux-x64.tar.gz \
            tp-agent-macos-arm64.tar.gz \
            tp-agent-macos-x64.tar.gz \
            tp-agent-windows-x64.zip; do
            test -s "dist/$asset" || { echo "::error::missing $asset"; exit 1; }
          done
      - name: Publish st52/agents Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
